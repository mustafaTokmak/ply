name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      # With these repository secrets the release is signed with Developer ID and notarized;
      # without them it is ad-hoc signed:
      #   DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD, DEVELOPER_ID_IDENTITY,
      #   ASC_KEY_P8 (base64 AuthKey .p8), ASC_KEY_ID, ASC_ISSUER_ID
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "PLY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "PLY_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build
        env:
          PLY_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          PLY_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          PLY_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/build-app.sh
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        # A release published by hand (for example with a locally notarized build) is left as is.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Ply $GITHUB_REF_NAME" --generate-notes
